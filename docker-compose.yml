# =============================================================================
# tidyorg — example run (two images: engine + dashboard)
# =============================================================================
# Engine: copy config.example/ to ./config, drop your GitHub App private key at
# ./app.pem, set the three variables below, then:
#
#   docker compose run --rm engine validate   # no credentials needed
#   docker compose run --rm engine plan
#   docker compose run --rm engine apply
#
# Dashboard (optional, long-running web UI):
#
#   docker compose up dashboard               # serves on http://localhost:8080
#
# Engine state is kept in ./state on the host by default (TF_STATE=local); set
# TF_STATE=hcp (with TF_CLOUD_ORGANIZATION / TF_WORKSPACE / TF_TOKEN_app_terraform_io)
# or TF_STATE=custom to use a remote backend instead.
# =============================================================================
services:
  engine:
    build: .
    image: tidyorg:dev
    volumes:
      - ./config:/config:ro
      - ./state:/state
      - ./app.pem:/secrets/app.pem:ro
    environment:
      TF_VAR_github_org_name: your-org
      TF_VAR_github_app_id: "000000"
      TF_VAR_github_app_installation_id: "00000000"
      # TF_STATE: local            # local (default) | hcp | custom
      # Billing email. ⚠️ Terraform APPLIES this value and cannot read the current
      # one back: if you leave it unset an empty string is written, which can
      # OVERWRITE your org's real billing email. Set it explicitly here, or edit
      # terraform/org-settings.tf to stop managing billing_email entirely.
      # TF_VAR_billing_email: billing@your-org.example
    command: ["plan"]

  dashboard:
    build: ./dashboard
    image: tidyorg-dashboard:dev
    ports:
      - "8080:8080"
    environment:
      GITHUB_CLIENT_ID: Iv23...          # the dashboard GitHub App's client_id
      CONFIG_OWNER: your-org             # owner of the config repo
      CONFIG_REPO: your-config-repo      # the config repo the dashboard edits
      CONFIG_BRANCH: main
