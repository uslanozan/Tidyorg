# =============================================================================
# privileged.yml — EXAMPLE SCHEMA · HUMAN-OWNED · CODEOWNERS PROTECTED
# =============================================================================
# Copy this file to config/privileged.yml. Read by terraform/people.tf.
# Defines org owners and org-scoped roles.
#
# 🔒 THE DASHBOARD NEVER WRITES TO THIS FILE. This is the only legitimate path
#    for privilege escalation (making someone an owner or head-of-engineering):
#    a CODEOWNERS-protected change + approval from an existing admin. people.yml
#    changes often and is written by the machine; this file changes rarely and is
#    written by a human.
#
# ⚠️ Every name here must also be in config/people.yml → members
#    (a privilege cannot precede membership — validated at the plan stage).
#
# -----------------------------------------------------------------------------
# FIELDS
# -----------------------------------------------------------------------------
# org_owners  People who will be org owners (the GitHub API equivalent is `admin`).
#             An org owner is authorized for EVERYTHING: admin on every repo,
#             exempt on every protected branch, add/remove members, org settings,
#             repo deletion.
#
# roles       Org-scoped role name → the people who carry that role. The only
#             org-scoped role is head-of-engineering (organization.yml →
#             roles.*.scope). Repo-scoped roles (mentor/developer) are NOT written
#             here; config/repositories/*.yml.
# =============================================================================

version: 1

org_owners:
  - mentor-a

roles:
  head-of-engineering:
    - mentor-a
