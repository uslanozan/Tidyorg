# =============================================================================
# TASLAK — Organizasyon Konfigürasyon Şeması (v0, henüz uygulanmadı)
# =============================================================================
# Bu dosya UI/dashboard ile Terraform arasındaki SÖZLEŞMEDİR.
# Dashboard bu dosyayı düzenleyip PR açar; Terraform bunu okuyup GitHub'a uygular.
# Terraform kodu (HCL) bu dosyaya bakar; dashboard HCL'e asla dokunmaz.
#
# Tasarım ilkesi: KURALLAR ROLE BAĞLIDIR, KİŞİYE DEĞİL.
# Kişi değiştiğinde kural değişmez; sadece rol ataması değişir.
#
# Bkz. ACCESS-MODEL.md
# =============================================================================

version: 1
organization: your-org

# -----------------------------------------------------------------------------
# ROLLER — Yetkinin ne anlama geldiği burada tanımlanır, tek yerde.
# -----------------------------------------------------------------------------
roles:
  head-of-engineering:
    scope: organization # Tüm repo'lara uygulanır
    repo_permission: admin
    bypass_branch_protection: true

  mentor:
    scope: repository # Yalnızca atandığı repo'da geçerli
    repo_permission: admin
    bypass_branch_protection: true

  developer:
    scope: repository
    repo_permission: push # Repo geneline write; branch kısıtı ayrıca uygulanır
    bypass_branch_protection: false

  # future work — şimdilik kullanılmıyor
  # consultant:
  #   scope: repository
  #   repo_permission: pull
  #   bypass_branch_protection: false

# -----------------------------------------------------------------------------
# KİŞİLER — Yalnızca kimlik ve organizasyon geneli rol ataması.
# Repo bazlı atamalar aşağıda, repositories bölümünde yapılır.
# -----------------------------------------------------------------------------
people:
  uslanozan:
    org_role: admin # GitHub org seviyesi: admin | member
    roles: [head-of-engineering]

  paitblack:
    org_role: admin
    roles: [head-of-engineering]

  # Örnek mentör ve developer'lar
  mentor-a: { org_role: member }
  mentor-b: { org_role: member }
  dev-1: { org_role: member }
  dev-2: { org_role: member }
  dev-3: { org_role: member }

# -----------------------------------------------------------------------------
# VARSAYILANLAR — Her repo bunları miras alır. Repo bazında ezilebilir.
# Yeni bir repo hiçbir şey yazmadan da güvenli varsayılanlarla doğar.
# -----------------------------------------------------------------------------
defaults:
  visibility: private
  has_issues: true
  has_projects: false
  has_wiki: false
  auto_init: true
  default_branch: develop

  protected_branches:
    main:
      required_reviews: 2
      require_code_owner_review: true # Mentör onayı zorunlu
      dismiss_stale_reviews: true
      require_status_checks: [ci/test]
      require_conversation_resolution: true
      allow_force_push: false
      allow_deletions: false
      # Bu branch'e yalnızca şu ROLLER push atabilir (kişi listesi değil!)
      push_allowed_roles: [mentor, head-of-engineering]

    develop:
      required_reviews: 1
      require_code_owner_review: false # Başka bir developer'ın onayı yeterli
      dismiss_stale_reviews: true
      require_status_checks: [ci/test]
      require_conversation_resolution: false
      allow_force_push: false
      allow_deletions: false
      push_allowed_roles: [mentor, head-of-engineering]

  labels:
    - { name: "type: bug", color: "d73a4a" }
    - { name: "type: feature", color: "0e8a16" }
    - { name: "type: chore", color: "cfd3d7" }
    - { name: "type: docs", color: "0075ca" }
    - { name: "priority: critical", color: "b60205" }
    - { name: "priority: high", color: "d93f0b" }
    - { name: "priority: medium", color: "fbca04" }
    - { name: "priority: low", color: "c2e0c6" }
    - { name: "status: in-review", color: "5319e7" }
    - { name: "status: blocked", color: "e99695" }
    - { name: "status: ready", color: "0e8a16" }
    - { name: "good first issue", color: "7057ff" }
    - { name: "help wanted", color: "008672" }

# -----------------------------------------------------------------------------
# REPO'LAR — Dashboard'un asıl yazdığı bölüm.
# Yalnızca varsayılandan FARKLI olan alanlar yazılır.
# -----------------------------------------------------------------------------
repositories:
  # --- Varsayılanlarla yetinen repo: 5 satır ---
  payments-api:
    description: "Ödeme servisi"
    language: go
    mentors: [mentor-a]
    developers: [dev-1, dev-2]

  # --- Kuralı ezen repo ---
  billing-web:
    description: "Faturalandırma arayüzü"
    language: typescript
    mentors: [mentor-a] # Aynı mentör iki repo'da (4 mentör × 2 repo)
    developers: [dev-2, dev-3] # dev-2 iki projede — many-to-many
    protected_branches:
      main:
        required_reviews: 3 # Yalnızca farklı olan alan yazılır

    # OPSİYONEL — yalnızca içinde gerçekten ayrışma olan repo'larda (monorepo vb.)
    # yazılır. Yazılmazsa CODEOWNERS "*  @<repo>-devs" olarak üretilir.
    #
    # DİKKAT: Bu merge YETKİSİNİ kısıtlamaz. GitHub'da write yetkisi daima repo
    # geneline verilir, dosya yoluna göre daraltılamaz. Buradaki tanım yalnızca
    # "şu yol değişmişse şu kişinin ONAYI gerekir" anlamına gelir ve ancak
    # require_code_owner_review: true iken zorlayıcıdır.
    code_owners:
      "/backend/": [dev-2]
      "/frontend/": [dev-3]

  # --- Küçük ekip: mentör onayı zorunlu değil ---
  internal-tools:
    description: "İç araçlar"
    language: python
    mentors: [mentor-b]
    developers: [dev-1]
    protected_branches:
      main:
        required_reviews: 1
        require_code_owner_review: false # 2 kişilik projede mentör darboğaz olmasın

  # --- Hızlı geliştirme / prototip repo'su ---
  # code_owners yazılmaz -> CODEOWNERS "*  @rapid-prototype-devs" olur.
  # Gevşetilen şey onay kuralları; branch koruması yine de kalkmaz.
  rapid-prototype:
    description: "Hızlı deneme projesi"
    language: typescript
    mentors: [mentor-b]
    developers: [dev-1, dev-3]
    protected_branches:
      main:
        required_reviews: 1 # 2 yerine 1
        require_code_owner_review: false # Mentör beklemeye gerek yok
      develop:
        required_reviews: 0 # Onaysız merge serbest
        require_status_checks: [] # CI beklemeden merge
        # push_allowed_roles ezilmedi: developer yine de doğrudan push atamaz,
        # katkı PR üzerinden gelir. Sadece onay/CI beklentisi kalkmış olur.

  # --- Arşivlenmiş repo: silinmez, dondurulur ---
  legacy-api:
    description: "Kullanımdan kalkan servis"
    language: php
    archived: true
    mentors: [mentor-b]
    developers: []
# =============================================================================
# AÇIK NOKTALAR
# =============================================================================
# - consultant rolü ve expires_at alanı: future work
# - Takım adları config'de yok, repo adından türetilir: "<repo>-devs"
# - Org geneli fonksiyonel takımlar (backend/frontend/devops) BİLİNÇLİ OLARAK yok.
#   Ekip full-stack çalıştığı için herkes her disiplinde olurdu ve sınıflandırma
#   hiçbir bilgi taşımazdı. Path bazlı review ihtiyacı, repo bazında opsiyonel
#   code_owners alanıyla karşılanıyor. İleride uzmanlaşma olursa opsiyonel bir
#   alan olarak eklenebilir (kırıcı değişiklik değil).
# - Format YAML seçildi (PR'da okunabilirlik için). Dashboard JSON üretmeyi
#   tercih ederse Terraform tarafında yamldecode -> jsondecode değişimi yeterli.
