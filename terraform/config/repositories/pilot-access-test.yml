# =============================================================================
# TEMPORARY — access isolation test (2026-08-18)
# =============================================================================
# Goal: does `default_repository_permission = none` actually work?
#
# The setup is deliberately in a "no permission granted to anyone" state:
#   mentors    → only uslanozan (must be an owner of the repo)
#   developers → EMPTY
#
# Expected result: `paitblack` and `medine2906` can NEVER see this repo. Both are
# org members but on none of its teams; before `none`, the org default would give
# them `read`.
#
# ⚠️ `visibility: private` is MANDATORY — without this line the test is invalid.
# `defaults.visibility` = `public` and a public repo is visible to everyone on
# the internet; their ability to see it would come from it being public, not from
# the base permission.
#
# ⚠️ The cost: on the free plan, branch protection does not work on a private
# repo. That is why `protected_branches` is removed below. Protected branches
# were already validated on the other three repos (pilot-verification.md
# Section 6), so nothing is lost here.
#
# 🗑️ CLEANUP — deleting this file does NOT delete the repo.
# The module has `prevent_destroy = true` (main.tf): so that a repo row
# accidentally dropping from the config does not destroy the repo. So if you just
# delete this YAML, apply errors out. The correct order:
#   1. Delete the repo from the GitHub UI (Settings → Danger Zone)
#   2. `terraform state rm 'module.repositories["pilot-access-test"]'`
#   3. Delete this file
# Alternative: write `archived: true` and leave it — it neutralizes without
# deleting.
# =============================================================================

description: HELLO HELLO IT'S OZAN
language: typescript
visibility: private

mentors: [uslanozan]
developers: []

# The free plan has no branch protection API on a private repo; they are removed
# from defaults via `null` (the removal escape hatch — see repositories.tf).
protected_branches:
  main: null
  develop: null
