description: "Infrastructure as Code for managing the Tidyorg organization"
language: hcl

# ⚠️ BU LİSTE BUGÜNKÜ EN ÖNEMLİ GÜVENLİK SINIRIDIR — kilitlerden daha önemli.
#
# `mentor` ORG GENELİ BİR ROL DEĞİL, repo kapsamlıdır. Yani `pilot-intern-api`'ye
# mentör olan biri BU repo'da hiçbir yetkiye sahip değil. Buradaki mentör ise
# kontrol düzleminin tamamında admin: Terraform kodunu, config'i ve branch
# protection'ı değiştirebilir.
#
# Ve Karar E gereği `enforce_admins = false` olduğu için bu kişi CODEOWNERS'ı da
# branch protection'ı da ATLAYABİLİR. Aşağıdaki `code_owners` kuralları ona karşı
# bilgilendiricidir, zorlayıcı değil.
#
# Yani projedeki tüm yetki kontrollerinin kapsamı bu listenin uzunluğuna bağlı.
# Buraya ikinci bir isim eklemek, o kişiye organizasyonun motoru üzerinde sınırsız
# yetki verir — sessizce. Gerçek yapısal sınır Faz 8'de gelir (motor / durum ayrımı).
mentors:
  - uslanozan
  # 2026-09-07 — şirket kapsamı (comp-scope) işinin eş-sahibi olarak eklendi.
  # ⚠️ Yukarıdaki uyarı geçerli: bu kişi artık kontrol düzleminde admin, Terraform
  # kodunu/config'i değiştirebilir ve Karar E gereği CODEOWNERS/branch protection'ı
  # bypass eder. Bilinçli karar (Ozan).
  - Dogancan-Acar

developers:
  - paitblack

default_branch: main

# Yol bazlı sahiplik — ACCESS-MODEL Karar 13.
#
# Varsayılan sahiplik `*` → bu repo'nun mentörleri (modül otomatik ekler).
# Aşağıdaki yollar ondan daha dar bir gruba, org geneli yönetici takımına bağlı.
#
# Neden bu iki yol:
#   terraform/        → organizasyonun tamamını üreten kod. Dashboard'un (ve
#                       ileride agent'ların) HCL'e dokunmasına karşı ikinci önlem.
#   .github/workflows → apply'ı çalıştıran iş akışları. Buraya yazabilen biri,
#                       Terraform'un yetkisini dolaylı olarak ele geçirir.
#
# ⚠️ `config/people.yml` bilerek BURADA DEĞİL. Onu da bağlamak her stajyer eklemeyi
# org yönetici onayına takardı — sık işlemi nadir işlemin hızına düşürürdü.
# Yetki yükseltme (`org_role: admin`) için ayrı bir kapı tasarımı TODO.md'de.
code_owners:
  "/terraform/": [your-org/platform-admins]
  "/.github/workflows/": [your-org/platform-admins]

# -----------------------------------------------------------------------------
# ŞABLON İSTİSNASI — dependabot: none  (2026-08-20)
# -----------------------------------------------------------------------------
# Bu repo şablon `dependabot.yml`'ını almıyor; kendi dosyasını elle yönetiyor.
#
# Sebep: şablondan `github-actions` ekosistemi çıkarıldı (GIT-37). Yönetilen
# repo'larda doğru karar — oradaki workflow'lar `strict`, yani Terraform'un;
# Dependabot'un açtığı sürüm PR'ı merge edilse bile bir sonraki apply geri alıyor
# ve Dependabot aynı PR'ı yeniden açıyor. Sonsuz döngü (2026-08-19, PR #18/#19).
#
# Ama BU repo'nun `terraform-plan.yml` ve `terraform-apply.yml` dosyaları
# Terraform'un DEĞİL — elle yazıldılar, şablonda yoklar. Onlarda döngü yok,
# Dependabot orada sorunsuz çalışıyor ve PR #19 ile gerçekten sürüm yükseltti.
# Şablonu olduğu gibi almak, döngüsü olmayan tek yerdeki çalışan otomasyonu da
# kapatırdı.
#
# ⚠️ Bedeli dogfooding'de bilinçli bir delik: bu repo bir dosyada kendi
# şablonunu tüketmiyor. Alternatifi (ikinci bir şablon varyantı) iki dosya
# arasında drift üretirdi.
#
# ⚠️ Şablondaki action sürümlerini (templates/.github/workflows/) artık hiçbir
# şey izlemiyor — Dependabot o yolu göremiyor. Yerine ne konacağı TODO.md'de.
files:
  dependabot: none

protected_branches:
  develop: null
