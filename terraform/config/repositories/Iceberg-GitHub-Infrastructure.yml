description: "Infrastructure as Code for managing the Tidyorg organization"
language: hcl

# ⚠️ THIS LIST IS THE MOST IMPORTANT SECURITY BOUNDARY TODAY — more important
# than the locks.
#
# `mentor` is NOT an org-wide role, it is repo-scoped. That is, someone who is a
# mentor on `pilot-intern-api` has NO permission on THIS repo. A mentor here,
# however, is admin over the entire control plane: they can change the Terraform
# code, the config, and branch protection.
#
# And because `enforce_admins = false` per Decision E, this person can BYPASS
# both CODEOWNERS and branch protection. The `code_owners` rules below are
# informational against them, not enforcing.
#
# So the scope of every permission control in the project depends on the length
# of this list. Adding a second name here gives that person unlimited authority
# over the engine of the organization — silently. The real structural boundary
# arrives in Phase 8 (engine / state separation).
mentors:
  - uslanozan
  # 2026-09-07 — added as co-owner of the company-scope (comp-scope) work.
  # ⚠️ The warning above applies: this person is now admin on the control plane,
  # can change the Terraform code/config, and per Decision E bypasses
  # CODEOWNERS/branch protection. A deliberate decision.
  - Dogancan-Acar

developers: []

default_branch: main

# Path-based ownership — ACCESS-MODEL Decision 13.
#
# The default ownership `*` → this repo's mentors (the module adds it
# automatically). The paths below are bound to a narrower group, the org-wide
# admin team.
#
# Why these two paths:
#   terraform/        → the code that generates the entire organization. A second
#                       safeguard against the dashboard (and, later, agents)
#                       touching the HCL.
#   .github/workflows → the workflows that run apply. Whoever can write here
#                       indirectly seizes Terraform's authority.
#
# ⚠️ `config/people.yml` is intentionally NOT HERE. Binding it too would gate
# every intern addition on org admin approval — dropping a frequent operation to
# the speed of a rare one. A separate gate design for privilege escalation
# (`org_role: admin`) is in TODO.md.
code_owners:
  "/terraform/": [your-org/platform-admins]
  "/.github/workflows/": [your-org/platform-admins]

# -----------------------------------------------------------------------------
# TEMPLATE EXCEPTION — dependabot: none  (2026-08-20)
# -----------------------------------------------------------------------------
# This repo does not take the template `dependabot.yml`; it manages its own file
# by hand.
#
# Reason: the `github-actions` ecosystem was removed from the template (GIT-37).
# The right call for managed repos — the workflows there are `strict`, i.e.
# Terraform's; even if a version PR opened by Dependabot is merged, the next
# apply reverts it and Dependabot reopens the same PR. An infinite loop
# (2026-08-19, PR #18/#19).
#
# But THIS repo's `terraform-plan.yml` and `terraform-apply.yml` files are NOT
# Terraform's — they were written by hand and are not in the template. There is
# no loop in them, Dependabot works there without issue, and it genuinely bumped
# a version via PR #19. Taking the template as-is would also turn off the working
# automation in the one place that has no loop.
#
# ⚠️ The cost is a deliberate hole in dogfooding: this repo does not consume its
# own template in one file. The alternative (a second template variant) would
# produce drift between the two files.
#
# ⚠️ The action versions in the template (templates/.github/workflows/) are no
# longer watched by anything — Dependabot cannot see that path. What to put in
# its place is in TODO.md.
files:
  dependabot: none

protected_branches:
  develop: null

viewers: []
