# =============================================================================
# Privileges — LIVE FILE · HUMAN-OWNED · CODEOWNERS PROTECTED
# =============================================================================
# Read by terraform/people.tf. Defines org owners and org-scoped roles
# (head-of-engineering).
#
# 🔒 THE DASHBOARD NEVER WRITES TO THIS FILE. This is the only legitimate path
#    for privilege escalation: adding/removing a name in this file is a
#    CODEOWNERS-protected change like a `.tf` file and requires approval from an
#    existing platform-admin. people.yml changes often and is written by the
#    machine; this file changes rarely and is written by a human.
#
# ⚠️ Every name here must also be in config/people.yml → `members`.
#    A privilege cannot precede membership (validated at the plan stage).
#
# -----------------------------------------------------------------------------
# FIELDS
# -----------------------------------------------------------------------------
# org_owners  People who will be org owners. The GitHub API equivalent is `admin`.
#             An org owner is authorized for EVERYTHING: admin on every repo,
#             exempt on every protected branch, add/remove members, org settings,
#             repo deletion.
#
# roles       Org-scoped role name → the people who carry that role. Today the
#             only org-scoped role is head-of-engineering (organization.yml →
#             roles.*.scope). Repo-scoped roles (mentor/developer) are NOT written
#             here; they live in config/repositories/*.yml.
# =============================================================================

version: 1

