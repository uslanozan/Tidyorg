# =============================================================================
# Organizasyon Konfigürasyonu — CANLI DOSYA
# =============================================================================
# Bu dosya Terraform tarafından okunur (terraform/repositories.tf).
# Burada yapılan her değişiklik, apply sonrası GitHub'a yansır.
#
# Bu dosya YALNIZCA organizasyon düzeyindeki ayarları içerir:
# roller, varsayılanlar, kişiler, org_admin_team.
#
# Repo tanımları ayrı dosyalardadır: config/repositories/<repo-adı>.yml
# Yeni repo eklemek için bu dosyaya dokunulmaz; config/repositories/ altına
# yeni bir .yml dosyası eklenir.
#
# Şemanın tüm alanları ve örnekleri için: config/organization.example.yml
# Modelin gerekçeleri için: ACCESS-MODEL.md
# =============================================================================

version: 1
organization: your-org

# -----------------------------------------------------------------------------
# ROLLER — Yetkinin ne anlama geldiği tek yerde tanımlanır.
# -----------------------------------------------------------------------------
roles:
  head-of-engineering:
    scope: organization
    repo_permission: admin
    bypass_branch_protection: true

  mentor:
    scope: repository
    repo_permission: admin
    bypass_branch_protection: true

  developer:
    scope: repository
    repo_permission: push
    bypass_branch_protection: false

# head-of-engineering rolünü taşıyan organizasyon seviyesi takım
org_admin_team: platform-admins

# -----------------------------------------------------------------------------
# KİŞİLER
# -----------------------------------------------------------------------------
# Bu bölüm terraform/people.tf tarafından tüketilir (2026-08-18'den beri).
#
# ⚠️ Buraya bir kişi eklemek GERÇEK BİR ORG DAVETİ üretir; çıkarmak ise kişiyi
# atmaz, yalnızca `member`a düşürür (`downgrade_on_destroy`).
#
# `org_role` ZORUNLUDUR (`admin` | `member`) — yazılmazsa plan hata verir.
# Varsayılana düşürülmüyor, çünkü org rolü kişinin branch protection dahil her
# kuralı atlayıp atlayamayacağını belirler; unutulmuş olması ile bilinçli `member`
# olması aynı şey değildir.
#
# `roles` YALNIZCA org kapsamlı rol taşır (bugün: head-of-engineering). Repo
# kapsamlı roller (mentor/developer) config/repositories/*.yml içinde yaşar.
# Kural `roles:` bloğundaki `scope` alanından türetilir ve plan aşamasında
# zorlanır — yanlış yere yazılan rol sessizce durmaz, hata verir.
#
# ⚠️ `uslanozan` bilerek YÖNETİM DIŞINDA (people.tf → unmanaged_people): en az bir
# org owner Terraform'un dışında kalmalı, yoksa hatalı bir apply organizasyonu
# geri dönüşü olmayan biçimde kilitleyebilir.
people:
  uslanozan:
    org_role: admin
    roles: [head-of-engineering]

  # 2026-08-15 — projeden ayrıldı, head-of-engineering'den developer'a indirildi.
  # Bu bölüm tüketilmediği için asıl zorlayıcı beyan org-membership.tf'dedir.
  #
  # NOT: Buraya `roles: [developer]` YAZILMAZ. `roles` yalnızca org kapsamlı rolleri
  # taşır (head-of-engineering). mentor/developer repo kapsamlıdır ve
  # config/repositories/*.yml içinde yaşar — ikisini karıştırmak, config'in sessizce
  # yalan söylediği duruma yol açar.
  paitblack:
    org_role: member

  # 2026-08-16 — dashboard geliştiricisi. Repo yetkisi
  # config/repositories/Tidyorg.yml içinde `developers` olarak
  # veriliyor; burada yalnızca org rolü beyan ediliyor.
  medine2906:
    org_role: member

# -----------------------------------------------------------------------------
# VARSAYILANLAR — Her repo bunları miras alır, repo bazında ezilebilir.
# -----------------------------------------------------------------------------
defaults:
  visibility: public # FREE PLAN: private repo'da branch protection çalışmıyor
  has_issues: true
  has_projects: false
  has_wiki: false
  auto_init: true
  default_branch: develop

  # ---------------------------------------------------------------------------
  # GÜVENLİK
  # ---------------------------------------------------------------------------
  # vulnerability_alerts → Dependabot güvenlik uyarıları. Her planda, her
  #   görünürlükte çalışır. Kapatmak bilinçli bir karar olmalı.
  #
  # secret_scanning → Secret scanning + push protection. Asıl değerli olan
  #   ikincisi: sızdırılmış anahtar repo'ya GİRMEDEN push reddedilir.
  #   ⚠️ Yalnızca PUBLIC repo'da ücretsiz; private repo GitHub Advanced Security
  #   (Enterprise) ister. Modül private repo'da bu ayarı sessizce atlar — burada
  #   `true` bırakmak private repo'nun apply'ını patlatmaz.
  #
  # `advanced_security` bilerek yönetilmiyor: public'te örtük açık, private'ta
  # lisans gerektiriyor. İkisinde de yönetmeye çalışmak hata üretir.
  vulnerability_alerts: true
  secret_scanning: true

  # ---------------------------------------------------------------------------
  # ŞABLON DAĞITIMI
  # ---------------------------------------------------------------------------
  # Kaynak dosyalar: terraform/templates/ — ağaç yapısı repo içindeki hedef yolu
  # birebir yansıtır, yani ayrı bir hedef yolu tanımlamaya gerek yoktur.
  #
  # Modlar:
  #   strict → Terraform içeriği sahiplenir. Elle yapılan değişiklik bir sonraki
  #            apply'da geri alınır. Yönetişim dosyaları için.
  #   seed   → Yalnızca ilk oluşturmada yazılır (`ignore_changes = [content]`);
  #            repo sonradan kendine göre değiştirebilir. İçerik dosyaları için.
  #   none   → Hiç yazılmaz.
  #
  # Mod tablosunun gerekçesi: ROADMAP.md → K1
  files:
    contributing: seed
    security: seed
    editorconfig: seed
    pr_template: strict
    issue_templates: strict
    dependabot: strict

  # Dağıtılacak workflow'lar. Kaynak: terraform/templates/.github/workflows/<ad>.yml
  # Workflow'lar daima `strict` — yönetişim dosyasıdır, elle değiştirilemez.
  #
  # DİKKAT: `ci` buradan çıkarılırsa o repo'da `ci/test` status check'i hiç
  # raporlanmaz. `protected_branches.*.require_status_checks` içinde `ci/test`
  # duruyorsa PR'lar sonsuza kadar bekler. Modül bu tutarsızlığı `precondition`
  # ile hata olarak verir — sessizce geçmez.
  workflows: [ci]

  protected_branches:
    main:
      required_reviews: 2
      require_code_owner_review: true
      dismiss_stale_reviews: true
      require_status_checks: [ci/test]
      require_conversation_resolution: true
      allow_force_push: false
      allow_deletions: false
      push_allowed_roles: [mentor, head-of-engineering]

    develop:
      required_reviews: 1
      require_code_owner_review: false
      dismiss_stale_reviews: true
      require_status_checks: [ci/test]
      require_conversation_resolution: false
      allow_force_push: false
      allow_deletions: false
      push_allowed_roles: [mentor, head-of-engineering]

  labels:
    - { name: "type: bug", color: "d73a4a", description: "Hatalı davranış" }
    - { name: "type: feature", color: "0e8a16", description: "Yeni özellik" }
    - { name: "type: chore", color: "cfd3d7", description: "Bakım işi" }
    - { name: "type: docs", color: "0075ca", description: "Dokümantasyon" }
    - { name: "priority: critical", color: "b60205", description: "Acil müdahale" }
    - { name: "priority: high", color: "d93f0b", description: "Yüksek öncelik" }
    - { name: "priority: medium", color: "fbca04", description: "Orta öncelik" }
    - { name: "priority: low", color: "c2e0c6", description: "Düşük öncelik" }
    - { name: "status: in-review", color: "5319e7", description: "İnceleme bekliyor" }
    - { name: "status: blocked", color: "e99695", description: "Engellenmiş" }
    - { name: "status: ready", color: "0e8a16", description: "Başlanabilir" }
    - { name: "good first issue", color: "7057ff", description: "Yeni katılanlar için" }
    - { name: "help wanted", color: "008672", description: "Yardım aranıyor" }
