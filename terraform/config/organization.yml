# =============================================================================
# Organization Configuration — LIVE FILE
# =============================================================================
# This file is read by Terraform (terraform/repositories.tf).
# Every change made here is reflected to GitHub after apply.
#
# This file contains ONLY organization-level settings:
# roles, defaults, people, org_admin_team.
#
# Repo definitions live in separate files: config/repositories/<repo-name>.yml
# To add a new repo you do not touch this file; you add a new .yml file under
# config/repositories/.
#
# For all schema fields and examples see: config/organization.example.yml
# For the rationale of the model see: ACCESS-MODEL.md
# =============================================================================

version: 1
# The org name comes from a SINGLE SOURCE: TF_VAR_github_org_name (variables.tf).
# It is not repeated here — keeping it in two places would break team slugs on a
# mismatch.

# -----------------------------------------------------------------------------
# ROLES — What a permission means is defined in one place.
# -----------------------------------------------------------------------------
roles:
  head-of-engineering:
    scope: organization
    repo_permission: admin
    bypass_branch_protection: true

  mentor:
    scope: repository
    repo_permission: admin
    bypass_branch_protection: true

  developer:
    scope: repository
    repo_permission: push
    bypass_branch_protection: false

  # Read-only repo role. People in the `viewers:` list see and clone the repo
  # but cannot push. E.g. an observer / advisor from another team.
  viewer:
    scope: repository
    repo_permission: pull
    bypass_branch_protection: false

# The organization-level team that carries the head-of-engineering role
org_admin_team: platform-admins

# Organization profile (as shown in the GitHub UI). Config manages it so that
# each apply does not try to wipe these fields. Will change here on a rebrand.
profile:
  name: "Tidyorg"
  description: "Desc created by Ozan"
  blog: "https://x.example.com/"
  location: "United Kingdom"

# -----------------------------------------------------------------------------
# PEOPLE — in a separate file
# -----------------------------------------------------------------------------
# The `people` section was moved to config/people.yml on 2026-08-18.
#
# Reason: this file defines WHAT ROLES MEAN (roles, defaults,
# protected_branches) — a rarely changing, high-risk area. The list of people
# is a frequently changing, low-risk area. Keeping both in the same file meant
# opening the file that holds the permission definitions just to add an intern.
#
# This separation will also be needed once the dashboard moves to write mode
# (ACCESS-MODEL Decision 16): the machine can regenerate the people list but
# must not touch the role definitions.
# -----------------------------------------------------------------------------

# -----------------------------------------------------------------------------
# DEFAULTS — Every repo inherits these; they can be overridden per repo.
# -----------------------------------------------------------------------------
defaults:
  visibility: public # FREE PLAN: branch protection does not work on a private repo
  has_issues: true
  has_projects: false
  has_wiki: false
  auto_init: true
  default_branch: develop

  # ---------------------------------------------------------------------------
  # SECURITY
  # ---------------------------------------------------------------------------
  # vulnerability_alerts → Dependabot security alerts. Works on every plan, at
  #   every visibility. Turning it off should be a deliberate decision.
  #
  # secret_scanning → Secret scanning + push protection. The truly valuable part
  #   is the second one: a leaked key is rejected on push BEFORE it enters the
  #   repo.
  #   ⚠️ Free only on a PUBLIC repo; a private repo requires GitHub Advanced
  #   Security (Enterprise). The module silently skips this setting on a private
  #   repo — leaving it `true` here does not blow up a private repo's apply.
  #
  # `advanced_security` is intentionally not managed: implicitly on for public,
  # requires a license for private. Trying to manage it in both cases produces
  # errors.
  vulnerability_alerts: true
  secret_scanning: true

  # ---------------------------------------------------------------------------
  # TEMPLATE DISTRIBUTION
  # ---------------------------------------------------------------------------
  # Source files: terraform/templates/ — the tree structure mirrors the target
  # path inside the repo exactly, so there is no need to define a separate
  # target path.
  #
  # Modes:
  #   strict → Terraform owns the content. A manual change is reverted on the
  #            next apply. For governance files.
  #   seed   → Written only on first creation (`ignore_changes = [content]`);
  #            the repo may modify it afterward. For content files.
  #   none   → Never written.
  #
  # Rationale for the mode table: ROADMAP.md → K1
  files:
    contributing: seed
    security: seed
    editorconfig: seed
    pr_template: strict
    issue_templates: strict
    dependabot: strict

  # Workflows to distribute. Source: terraform/templates/.github/workflows/<name>.yml
  # Workflows are always `strict` — they are governance files and cannot be
  # changed by hand.
  #
  # CAUTION: if `ci` is removed from here, the `ci/test` status check is never
  # reported in that repo. If `ci/test` remains in
  # `protected_branches.*.require_status_checks`, PRs wait forever. The module
  # surfaces this inconsistency as an error via a `precondition` — it does not
  # pass silently.
  workflows: [ci]

  protected_branches:
    main:
      # 2026-08-20: lowered 2 → 1 (arose from the GIT-37 discussion).
      #
      # The reason is behavioral, not technical. The team is three people and
      # most PRs to `main` are routine: a Dependabot version bump, a docs fix.
      # Requiring two approvals kept them waiting, and waiting PRs started being
      # merged via bypass (PR #19). The worst state for a rule is one that is
      # regularly skipped: it stands on paper, does not exist in practice, and
      # skipping it turns into a habit.
      #
      # 1 approval PRESERVES the four-eyes principle — author + approver. What is
      # lost is the third pair of eyes; in a three-person team its cost exceeds
      # its benefit.
      #
      # ⚠️ This is an ORG DEFAULT. A higher-risk repo can raise
      # `required_reviews` in its own file — it varies from repo to repo. Because
      # `require_code_owner_review` stays `true` here, changes to `/terraform/`
      # and `/.github/workflows/` in this repo still require platform-admins
      # approval; the lowered count does not open that door.
      required_reviews: 1
      require_code_owner_review: true
      dismiss_stale_reviews: true
      require_status_checks: [ci/test]
      require_conversation_resolution: true
      allow_force_push: false
      allow_deletions: false
      push_allowed_roles: [mentor, head-of-engineering]

    develop:
      required_reviews: 1
      require_code_owner_review: false
      dismiss_stale_reviews: true
      require_status_checks: [ci/test]
      require_conversation_resolution: false
      allow_force_push: false
      allow_deletions: false
      push_allowed_roles: [mentor, head-of-engineering]

  labels:
    - { name: "type: bug", color: "d73a4a", description: "Faulty behavior" }
    - { name: "type: feature", color: "0e8a16", description: "New feature" }
    - { name: "type: chore", color: "cfd3d7", description: "Maintenance work" }
    - { name: "type: docs", color: "0075ca", description: "Documentation" }
    - { name: "priority: critical", color: "b60205", description: "Urgent response" }
    - { name: "priority: high", color: "d93f0b", description: "High priority" }
    - { name: "priority: medium", color: "fbca04", description: "Medium priority" }
    - { name: "priority: low", color: "c2e0c6", description: "Low priority" }
    - { name: "status: in-review", color: "5319e7", description: "Awaiting review" }
    - { name: "status: blocked", color: "e99695", description: "Blocked" }
    - { name: "status: ready", color: "0e8a16", description: "Ready to start" }
    - { name: "good first issue", color: "7057ff", description: "For newcomers" }
    - { name: "help wanted", color: "008672", description: "Help wanted" }
