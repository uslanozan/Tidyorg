# =============================================================================
# Individual Repository Configuration Schema — ALL FIELDS
# =============================================================================
# Each .yml file under config/repositories/ defines one repo.
# The file name = the repo name (the name that will be created on GitHub).
#
# Write ONLY the fields that DIFFER FROM THE DEFAULTS. Fields left blank are
# inherited from config/organization.yml → defaults.
# =============================================================================

# --- Required ---------------------------------------------------------------

# Repo description.
description: "Payment gateway integration service"

# Main programming language. For the visual label only; CI detects the language
# automatically from the repo files. Free text (the dashboard shows a logo for
# known languages, a single letter for the rest).
language: go

# At least one mentor is required. Mentors get `admin` permission on the repo.
mentors:
  - mentor-a

# --- People (optional) ------------------------------------------------------

# Developers get `push` permission and are subject to branch protection.
developers:
  - dev-1
  - dev-2

# Read-only (pull) access — sees and clones the repo, cannot push.
viewers:
  - observer-a

# --- Repo settings (optional — defaults apply if unspecified) ---------------

visibility: private # public | private
archived: false # true → the repo is frozen (use this instead of deleting)

has_issues: true
has_projects: false
has_wiki: false
auto_init: true # create with an initial commit (so the default branch exists)
default_branch: develop

# --- Security (optional — defaults: both on) --------------------------------

vulnerability_alerts: true # Dependabot security alerts (works on every plan)
secret_scanning: true # secret scanning + push protection (free only on public)

# --- Branch protection (optional — only fields that differ from the default) -
# `<branch>: null` has a special meaning: the org default protection is REMOVED
# for that branch.
protected_branches:
  main:
    required_reviews: 2 # number of approvals required before merge
    require_code_owner_review: true # additional approval from a CODEOWNERS owner
    dismiss_stale_reviews: true # a new commit dismisses old approvals
    require_status_checks: [ci/test] # CI checks that must be green
    require_conversation_resolution: true # all comments must be resolved
    allow_force_push: false
    allow_deletions: false
    push_allowed_roles: [mentor, head-of-engineering] # roles that can push directly
  develop:
    required_reviews: 0 # approval-free merge for quick experimentation
    require_status_checks: [] # merge without waiting for CI

# --- CODEOWNERS (optional) --------------------------------------------------
# Path → the people whose approval is required when that path changes. Enforcing
# only when require_code_owner_review: true; it does NOT restrict merge PERMISSION.
code_owners:
  "/backend/": [dev-1]
  "/frontend/": [dev-2]

# --- Template files (optional — shallow-merged on top of the defaults) -------
# strict = TF owns the content (a manual change is reverted on apply)
# seed   = written only on first creation, the repo may change it afterward
# none   = never written
files:
  contributing: seed
  security: seed
  pr_template: strict

# --- Workflows (optional) ---------------------------------------------------
# Source: terraform/templates/.github/workflows/<name>.yml — always strict.
# ⚠️ Without `ci`, the `ci/test` status check is never reported → branch
# protection waiting on it keeps PRs waiting forever (the module catches this
# with a precondition).
workflows:
  - ci
  - release

# --- Labels (optional) ------------------------------------------------------
# If provided, it REPLACES the org default seed labels (override, not inherit).
labels:
  - { name: "bug", color: "d73a4a", description: "Faulty behavior" }
  - { name: "enhancement", color: "0e8a16", description: "New feature" }
