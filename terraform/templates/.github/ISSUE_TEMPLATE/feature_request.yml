name: ✨ Feature Request
description: Propose a new capability or an improvement
title: "[Feature]: "
labels: ["type: feature"]
body:
  - type: markdown
    attributes:
      value: |
        The two fields that decide whether a feature gets picked up are **Motivation**
        and **Acceptance criteria**. A proposal without a clear "why" and a testable "done" is
        hard to prioritise, so please spend most of your time there. Please
        [search existing issues](../issues?q=is%3Aissue+label%3A%22type%3A+feature%22) first to avoid duplicates.

  - type: textarea
    id: description
    attributes:
      label: Feature description
      description: |
        What should be built? Describe the behaviour, not the implementation.
      placeholder: Users should be able to sign in with their company Google account instead of a password.
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Motivation / business value
      description: |
        What problem does this solve, and for whom? What happens if we do not build it?
        Numbers and concrete examples beat adjectives.
      placeholder: |
        Support handles ~15 password reset requests per week, each costing about 10 minutes.
        SSO removes that queue entirely and is a hard requirement for the enterprise deal in Q4.
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: |
        How do we know this is done? Write a checklist a reviewer can verify item by item.
        Each line must be objectively true or false — no "works well" or "is fast enough".
      value: |
        - [ ] Given ... when ... then ...
        - [ ] Given ... when ... then ...
        - [ ] Existing behaviour is unchanged
        - [ ] The flow is covered by a test
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternative solutions
      description: |
        What else did you consider, and why is this proposal better?
      placeholder: |
        We considered magic-link email sign-in, but it does not satisfy the customer's
        requirement to enforce access centrally through their identity provider.
    validations:
      required: false

  - type: textarea
    id: design-notes
    attributes:
      label: Design notes / mockups
      description: |
        Drag and drop mockups here, or link to a Figma file.
        Technical notes, API sketches, and open questions are welcome too.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this is not a duplicate
          required: true
        - label: My acceptance criteria are testable — each line can be verified as true or false
          required: true
