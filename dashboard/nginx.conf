# tidyorg dashboard — static SPA + same-origin GitHub OAuth/device proxy.
worker_processes 1;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;

  server {
    listen 8080;
    root   /usr/share/nginx/html;
    index  index.html;

    # Device Flow: github.com/login/* sends no CORS headers, so the browser cannot
    # call it directly. Proxy it same-origin under /gh-oauth/ (the dashboard's
    # deviceFlow.ts already targets this path). This is the self-hosted equivalent
    # of the Vite dev proxy / Vercel rewrite.
    location /gh-oauth/ {
      proxy_pass              https://github.com/;
      proxy_set_header        Host github.com;
      proxy_ssl_server_name   on;
      proxy_set_header        Accept application/json;
    }

    # SPA: every other path falls back to index.html so client routing works.
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
