# =============================================================================
# CI — validates the tidyorg engine and dashboard on every PR / push to main
# =============================================================================
# Two independent jobs:
#   terraform — fmt + validate the engine (against the bundled config.example)
#   dashboard — typecheck/build the SPA and run the YAML round-trip safety net
#
# The Docker images are built and published separately by release.yml on tags.
# (The multi-language CI that ships to managed repos lives in
#  terraform/templates/.github/workflows/ci.yml — do not confuse the two.)
# =============================================================================
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Format check
        run: terraform fmt -check -recursive

      # -backend=false: validate needs provider schemas but no state/credentials.
      - name: Init (no backend)
        run: terraform init -backend=false -input=false

      - name: Validate
        run: terraform validate

  dashboard:
    name: Dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck & build
        run: npm run build

      - name: Verify YAML round-trip
        run: npm run verify:yaml
