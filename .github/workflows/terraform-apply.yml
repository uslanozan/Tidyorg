name: "Terraform Apply"

on:
  push:
    branches:
      - main
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform-apply.yml'

permissions:
  contents: read

concurrency:
  group: terraform-apply
  cancel-in-progress: false

jobs:
  apply:
    name: "Terraform Apply"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: |
          terraform apply -auto-approve -no-color -input=false | tee apply_output.txt
          exit "${PIPESTATUS[0]}"

      # Since we run on push to `main`, there is no PR to comment on; warnings stay only
      # in the Actions log, and nobody opens the log of a job that went green.
      #
      # On 2026-08-18 the warning that the `vulnerability_alerts` field had been deprecated
      # was missed in exactly this way. This step carries warnings to two places:
      #   - `::warning::` → appears as an annotation at the VERY TOP of the run page
      #   - step summary  → a permanent, readable list
      #
      # `if: always()` is deliberate: warnings are even more valuable when the apply FAILS.
      - name: Surface Terraform Warnings
        if: always()
        run: |
          if [ ! -f apply_output.txt ]; then
            echo "Apply output not found - warning scan skipped." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Format (`-no-color`):  │ Warning: Argument is deprecated
          # The same warning repeats for every resource instance → we deduplicate and count.
          #
          # ⚠️ `grep -P` is DELIBERATELY not used: `│` is a multi-byte character and PCRE
          # mode is rejected in some locales with "supports only unibyte and UTF-8 locales".
          # This exact error was hit locally. `awk` works independently of the locale.
          extract() {
            awk -F'Warning:' '/^│[[:space:]]*Warning:/ {
              t = $2
              gsub(/^[[:space:]]+|[[:space:]]+$/, "", t)
              print t
            }' apply_output.txt
          }

          total=$(extract | wc -l | tr -d ' ')

          if [ "$total" -eq 0 ]; then
            echo "### ✅ No warnings" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          warnings=$(extract | sort | uniq -c | sort -rn)
          distinct=$(printf '%s\n' "$warnings" | wc -l | tr -d ' ')

          echo "### ⚠️ ${total} warnings - ${distinct} distinct" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$warnings" | while read -r count title; do
            echo "- **${title}** — ${count}×" >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=Terraform::${title} (${count}×)"
          done
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "_Deprecation warnings break apply on the next provider upgrade - do not let them pile up._" >> "$GITHUB_STEP_SUMMARY"
