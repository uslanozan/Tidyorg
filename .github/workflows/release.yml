# =============================================================================
# Release — build and publish the Docker images to GHCR
# =============================================================================
# On a version tag (e.g. v1.0.0) this builds both images and pushes them to the
# GitHub Container Registry under the repo owner's namespace:
#
#   ghcr.io/<owner>/tidyorg            (engine, from ./Dockerfile)
#   ghcr.io/<owner>/tidyorg-dashboard  (SPA,    from ./dashboard/Dockerfile)
#
# Nothing here is account-specific: the namespace comes from the repo owner and
# auth uses the built-in GITHUB_TOKEN, so it works wherever the repo lives.
# Tag a release with:  git tag v0.1.0 && git push origin v0.1.0
# A manual run (workflow_dispatch) publishes a throwaway :sha-... tag for testing.
#
# NOTE: on the FIRST publish, GHCR packages are created PRIVATE. Make each public
# once (GitHub → your profile → Packages → the package → Package settings →
# Change visibility → Public) so `docker pull` works without authentication.
# =============================================================================

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  images:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: tidyorg
            context: .
            file: ./Dockerfile
          - image: tidyorg-dashboard
            context: ./dashboard
            file: ./dashboard/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # QEMU + Buildx enable the multi-arch (amd64 + arm64) build below.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Derives image tags/labels from the git ref. metadata-action lowercases the
      # image name, so an owner with capitals is handled. On a semver tag it also
      # adds :latest (flavor latest=auto).
      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,enable=${{ github.ref_type != 'tag' }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
