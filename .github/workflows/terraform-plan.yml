name: "Terraform Plan"

on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform-plan.yml'

permissions:
  pull-requests: write
  contents: read

jobs:
  plan:
    name: "Terraform Plan"

    # Skipped on Dependabot PRs.
    #
    # The reason is technical: GitHub does NOT give Dependabot-opened PRs the normal
    # Actions secrets — it uses a separate vault (Settings → Secrets → Dependabot). So
    # `secrets.TF_API_TOKEN` comes through empty and `terraform init` blows up before it
    # can connect to HCP. This is exactly what was seen on 2026-08-19 in PR #18: the job
    # went red in 9 seconds.
    #
    # Rather than put the token in a second vault, we skip the job, because in this repo
    # Dependabot only bumps action versions — it never touches anything under
    # `terraform/`. If the plan ran, it would say `No changes`. Spreading the HCP token
    # to an extra place would be an attack surface with no upside.
    #
    # ⚠️ This job is NOT a required status check (`require_status_checks: [ci/test]`), so
    # skipping it does not block the PR.
    #
    # ⚠️ It checks the PR's OWNER, NOT `github.actor`. `github.actor` is whoever triggered
    # the run: if a human clicks "Re-run jobs" the value becomes that human, the condition
    # passes and the job blows up again — because GitHub applies the secret restriction
    # based on who OPENED the PR, not who triggered it. The first version had this bug.
    if: github.event.pull_request.user.login != 'dependabot[bot]'

    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Init
        id: init
        run: terraform init

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan -no-color -input=false > plan_output.txt
          cat plan_output.txt
        continue-on-error: true

      - name: Parse Plan and Post Comment
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            let planOutput = '';
            try {
              planOutput = fs.readFileSync('terraform/plan_output.txt', 'utf8');
            } catch (err) {
              planOutput = 'Plan output could not be read.';
            }

            // Terraform produces two different summaries:
            //   when there are changes → "Plan: X to add, Y to change, Z to destroy."
            //   when the plan is clean → "No changes. Your infrastructure matches the configuration."
            // In the second case the summary line is NEVER written. Searching only for the
            // first one caused the system to warn "summary not found" exactly when it was
            // healthiest — seen on the first live run on 2026-08-16.
            const summaryRegex = /Plan:\s+(\d+)\s+to\s+add,\s+(\d+)\s+to\s+change,\s+(\d+)\s+to\s+destroy/;
            const noChangesRegex = /No changes\.\s+Your infrastructure matches the configuration\./;
            const match = planOutput.match(summaryRegex);

            // Cosmetic drift: the GitHub API returns some fields in a different format than
            // the provider sent them, so every plan produces dozens of "Drift detected"
            // lines that overshadow the real changes. Putting the count in the summary
            // explains the wall of lines in the log (see docs/daily-logs/OZAN_CREW_NOTES.md).
            const driftCount = (planOutput.match(/Drift detected/g) || []).length;
            const driftNote = driftCount > 0
              ? `\n\n_${driftCount} × \`Drift detected\` - cosmetic, no apply required._`
              : '';

            // Warnings do NOT affect the plan SUMMARY: a plan that says "No changes" can
            // still carry warnings. On 2026-08-18 the warning that the `vulnerability_alerts`
            // field had been deprecated was missed in exactly this way — it was only noticed
            // when the apply output was `grep`-ed. When the provider upgrade lands that field
            // would be removed and apply would blow up without any signal.
            //
            // The second reason to extract warnings separately: the full log below is
            // truncated with MAX_LOG, and warnings sit at the END of the output — in a long
            // plan they drop out of the comment entirely.
            //
            // Format (`-no-color`):  │ Warning: Argument is deprecated
            // The same warning repeats for every resource instance, so it is deduplicated
            // and the number of occurrences is recorded.
            const warningTitles = [...planOutput.matchAll(/^│\s*Warning:\s*(.+?)\s*$/gm)].map(m => m[1]);
            const warningCounts = warningTitles.reduce((acc, title) => {
              acc[title] = (acc[title] || 0) + 1;
              return acc;
            }, {});
            const warningEntries = Object.entries(warningCounts);

            const warningLines = warningEntries.length === 0 ? [] : [
              '',
              `### ⚠️ ${warningTitles.length} warnings - ${warningEntries.length} distinct`,
              '',
              ...warningEntries.map(([title, n]) => `- **${title}**${n > 1 ? ` — ${n}×` : ''}`),
              '',
              "_Warnings do not affect the plan summary; a plan that looks clean can still carry them. Deprecation warnings break apply on the next provider upgrade._",
            ];

            let summaryText = '⚠️ Plan summary line not found in output — check the full log below.';

            if (match) {
              const addCount = parseInt(match[1], 10);
              const changeCount = parseInt(match[2], 10);
              const destroyCount = parseInt(match[3], 10);

              const destroyAlert = destroyCount > 0
                ? '🚨 **CRITICAL: DESTROYING RESOURCES!**'
                : '✅ No resources will be destroyed.';
              summaryText = `### 📊 Plan Summary\n- **Add**: ${addCount}\n- **Change**: ${changeCount}\n- **Destroy**: **${destroyCount}**\n\n${destroyAlert}${driftNote}`;
            } else if (noChangesRegex.test(planOutput)) {
              summaryText = `### 📊 Plan Summary\n\n✅ **No changes.** Infrastructure matches the configuration.${driftNote}`;
            }

            const fmtOutcome = '${{ steps.fmt.outcome }}' === 'success' ? '✅' : '❌';
            const initOutcome = '${{ steps.init.outcome }}' === 'success' ? '✅' : '❌';
            const validateOutcome = '${{ steps.validate.outcome }}' === 'success' ? '✅' : '❌';
            const planOutcome = '${{ steps.plan.outcome }}' === 'success' ? '✅' : '❌';

            // GitHub comments are limited to 65536 characters. A long plan output gets
            // truncated toward the end; since the summary and table are at the top of the
            // comment, readability is not affected.
            const MAX_LOG = 55000;
            const planLog = planOutput.length > MAX_LOG
              ? planOutput.slice(0, MAX_LOG) + '\n\n... (output truncated - see the Actions log for the full plan)'
              : planOutput;

            // CAUTION: This block is inside a YAML block scalar (`script: |`); every line
            // MUST be indented. If a multi-line template literal is used, the indentation
            // becomes part of the string and turns the markdown table into a code block.
            // That is why the lines are built as an array and joined.
            const output = [
              '## 📖 Terraform Pull Request Report',
              '',
              '| Step | Status |',
              '| :--- | :--- |',
              `| **Format Check** | ${fmtOutcome} |`,
              `| **Initialization** | ${initOutcome} |`,
              `| **Validation** | ${validateOutcome} |`,
              `| **Plan** | ${planOutcome} |`,
              '',
              summaryText,
              ...warningLines,
              '',
              '<details>',
              '<summary>🔍 Show Full Plan Log</summary>',
              '',
              '```terraform',
              planLog,
              '```',
              '',
              '</details>',
              '',
              `*Pushed by: @${context.actor}, Action: \`${context.eventName}\`*`,
            ].join('\n');

            // Find existing plan comment if any
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const botComment = comments.find(comment => {
              return comment.user.type === 'Bot' && comment.body.includes('## 📖 Terraform Pull Request Report');
            });

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: output,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: output,
              });
            }

            if ('${{ steps.plan.outcome }}' !== 'success' || '${{ steps.validate.outcome }}' !== 'success' || '${{ steps.fmt.outcome }}' !== 'success') {
              core.setFailed('Terraform checks failed.');
            }
