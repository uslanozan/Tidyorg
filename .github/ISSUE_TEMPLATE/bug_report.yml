name: 🐛 Bug Report
description: Report something broken or misbehaving
title: "[Bug]: "
labels: ["type: bug"]
body:
  - type: markdown
    attributes:
      value: |
        A reproducible report is worth ten vague ones. The more precisely you
        describe the failure, the faster it gets fixed. Please
        [search existing issues](../issues?q=is%3Aissue+label%3A%22type%3A+bug%22) first to avoid duplicates.

  - type: textarea
    id: description
    attributes:
      label: Bug description
      description: |
        What is broken? One or two sentences — details go in the fields below.
      placeholder: Uploading an avatar larger than 2 MB returns a 500 instead of a validation error.
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce
      description: |
        Exact steps to trigger the bug, starting from a clean state.
      value: |
        1.
        2.
        3.
        4. → Error:
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: |
        What should have happened?
      placeholder: The API should return 422 with a message naming the size limit.
    validations:
      required: true

  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual behavior
      description: |
        What actually happened? Include the exact error message if there is one.
      placeholder: The API returned 500 and the response body was empty.
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: |
        Critical: production down or data loss, no workaround. · High: core feature unusable,
        workaround is painful. · Medium: degraded, acceptable workaround exists. · Low: cosmetic.
      options:
        - Critical
        - High
        - Medium
        - Low
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: |
        Where did you see this? Delete any line that does not apply.
      value: |
        - OS:
        - Browser / client:
        - Version / commit SHA:
        - Environment: (local / staging / production)
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Screenshots / Logs
      description: |
        Drag and drop screenshots here, or paste relevant log output.
        **Redact secrets, tokens, and personal data before pasting.**
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this is not a duplicate
          required: true
        - label: I removed any secrets, tokens, or personal data from the logs above
          required: true
