# Forces every issue through one of the forms in this directory.
#
# Rationale: a structured issue is triageable on arrival — no round-trip
# asking the reporter for a version number or reproduction steps.
blank_issues_enabled: false

contact_links:
  - name: 💬 Question or idea
    url: https://github.com/orgs/your-org/discussions
    about: Not sure it is a bug or a feature yet? Open a discussion instead — issues are for actionable work.

  - name: 📖 Engineering handbook
    url: https://github.com/your-org/tidyorg/tree/main/docs
    about: Workflow, branching, commit convention, code review, and release process.

  - name: 🔐 Report a security vulnerability
    # Requires the org-level .github repository with a SECURITY.md.
    url: https://github.com/your-org/.github/security/policy
    about: Never report security issues in public issues, follow the policy here.
