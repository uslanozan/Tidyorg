# =============================================================================
# Dependabot — THIS FILE IS MANAGED BY HAND (it does NOT come from the template)
# =============================================================================
# ⚠️ DELIBERATELY DIFFERENT from terraform/templates/.github/dependabot.yml.
#
# This repo is marked with `files: { dependabot: none }` in the config, so Terraform
# does not touch this file. The reason:
#
#   The `github-actions` ecosystem was removed from the template (GIT-37), because in
#   managed repos the workflows are Terraform's in `strict` mode — even if the version
#   PR that Dependabot opens is merged, the next apply reverts it and the PR is
#   reopened. An endless loop (2026-08-19, PR #18/#19).
#
#   BUT this repo's `.github/workflows/terraform-plan.yml` and `terraform-apply.yml`
#   files are NOT Terraform's — they were written by hand and are not in the template.
#   There is no loop there and Dependabot actually works (PR #19 really did bump a
#   version).
#
#   So taking the template as-is would disable the one place where the automation works
#   without a loop. That is why `github-actions` stays HERE.
#
# See TODO.md → GIT-37 · config/repositories/tidyorg.yml
# =============================================================================

version: 2

updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["type: chore"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Patch and minor bumps arrive as one PR to keep review load manageable.
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["type: chore"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Patch and minor bumps arrive as one PR to keep review load manageable.
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["type: chore"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Patch and minor bumps arrive as one PR to keep review load manageable.
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: composer
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["type: chore"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Patch and minor bumps arrive as one PR to keep review load manageable.
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["type: chore"]
    commit-message:
      prefix: "chore(ci)"
    groups:
      # Everything in one PR, majors included — see the note in the header.
      # `patterns: ["*"]` matches every action; without it each action bump
      # opens its own pull request.
      all-actions:
        patterns: ["*"]
