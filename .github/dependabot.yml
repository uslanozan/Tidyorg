# =============================================================================
# Dependabot — BU DOSYA ELLE YÖNETİLİYOR (şablondan GELMİYOR)
# =============================================================================
# ⚠️ terraform/templates/.github/dependabot.yml ile BİLEREK FARKLI.
#
# Bu repo config'de `files: { dependabot: none }` ile işaretli, yani Terraform bu
# dosyaya dokunmuyor. Sebep:
#
#   Şablondan `github-actions` ekosistemi çıkarıldı (GIT-37), çünkü yönetilen
#   repo'lardaki workflow'lar `strict` modda Terraform'un — Dependabot'un açtığı
#   sürüm PR'ı merge edilse bile bir sonraki apply geri alıyor ve PR yeniden
#   açılıyor. Sonsuz döngü (2026-08-19, PR #18/#19).
#
#   AMA bu repo'nun `.github/workflows/terraform-plan.yml` ve `terraform-apply.yml`
#   dosyaları Terraform'un DEĞİL — elle yazıldılar, şablonda yoklar. Orada döngü yok
#   ve Dependabot fiilen çalışıyor (PR #19 gerçekten sürüm yükseltti).
#
#   Yani şablonu olduğu gibi almak, döngüsü olmayan tek yerdeki çalışan otomasyonu
#   kapatırdı. `github-actions` bu yüzden BURADA duruyor.
#
# Bkz. TODO.md → GIT-37 · config/repositories/tidyorg.yml
# =============================================================================

version: 2

updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["type: chore"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Patch and minor bumps arrive as one PR to keep review load manageable.
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["type: chore"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Patch and minor bumps arrive as one PR to keep review load manageable.
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["type: chore"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Patch and minor bumps arrive as one PR to keep review load manageable.
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: composer
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["type: chore"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Patch and minor bumps arrive as one PR to keep review load manageable.
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["type: chore"]
    commit-message:
      prefix: "chore(ci)"
    groups:
      # Everything in one PR, majors included — see the note in the header.
      # `patterns: ["*"]` matches every action; without it each action bump
      # opens its own pull request.
      all-actions:
        patterns: ["*"]
