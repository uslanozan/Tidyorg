# =============================================================================
# organization.yml — Organization-wide configuration (EXAMPLE)
# =============================================================================
# Copy this directory (config.example/) to `./config` and fill it with your own
# values:  cp -r config.example config  (then edit)
#
# This file is the CONTRACT between the UI/dashboard and Terraform.
# The dashboard edits this file and opens a PR; Terraform reads it and applies it to GitHub.
# The Terraform code (HCL) reads this file; the dashboard never touches the HCL.
#
# This file defines ONLY organization-wide settings.
# For individual repo definitions, see the repositories/ directory.
#
# Design principle: RULES ARE BOUND TO ROLES, NOT PEOPLE.
# When a person changes, the rule does not change; only the role assignment changes.
# =============================================================================

version: 1
organization: your-org # ← your own GitHub org slug (same as TF_VAR_github_org_name)

# -----------------------------------------------------------------------------
# ROLES — What a permission means is defined here, in one place.
# -----------------------------------------------------------------------------
roles:
  head-of-engineering:
    scope: organization # Applies to all repos
    repo_permission: admin
    bypass_branch_protection: true

  mentor:
    scope: repository # Valid only in the repo it is assigned to
    repo_permission: admin
    bypass_branch_protection: true

  developer:
    scope: repository
    repo_permission: push # Write across the repo; branch restrictions are applied separately
    bypass_branch_protection: false

# -----------------------------------------------------------------------------
# PEOPLE — NOT in this file, but in separate files
# -----------------------------------------------------------------------------
#   people.yml       → org membership (machine-owned; the dashboard writes it)
#   privileged.yml   → org owners + org roles (human-owned, CODEOWNERS
#                      protected; the dashboard NEVER writes it)
#
# This separation is the privilege-escalation gate: a file the dashboard can write
# CANNOT express privilege. Rationale: the terraform/people.tf header and ACCESS-MODEL.md.

# -----------------------------------------------------------------------------
# DEFAULTS — Every repo inherits these. Can be overridden per repo.
# A new repo is born with safe defaults even without writing anything.
# -----------------------------------------------------------------------------
defaults:
  visibility: private
  has_issues: true
  has_projects: false
  has_wiki: false
  auto_init: true
  default_branch: develop

  protected_branches:
    main:
      required_reviews: 2
      require_code_owner_review: true # Mentor approval required
      dismiss_stale_reviews: true
      require_status_checks: [ci/test]
      require_conversation_resolution: true
      allow_force_push: false
      allow_deletions: false
      # Only these ROLES can push to this branch (not a list of people!)
      push_allowed_roles: [mentor, head-of-engineering]

    develop:
      required_reviews: 1
      require_code_owner_review: false # Approval from another developer is sufficient
      dismiss_stale_reviews: true
      require_status_checks: [ci/test]
      require_conversation_resolution: false
      allow_force_push: false
      allow_deletions: false
      push_allowed_roles: [mentor, head-of-engineering]

  labels:
    - { name: "type: bug", color: "d73a4a" }
    - { name: "type: feature", color: "0e8a16" }
    - { name: "type: chore", color: "cfd3d7" }
    - { name: "type: docs", color: "0075ca" }
    - { name: "priority: critical", color: "b60205" }
    - { name: "priority: high", color: "d93f0b" }
    - { name: "priority: medium", color: "fbca04" }
    - { name: "priority: low", color: "c2e0c6" }
    - { name: "status: in-review", color: "5319e7" }
    - { name: "status: blocked", color: "e99695" }
    - { name: "status: ready", color: "0e8a16" }
    - { name: "good first issue", color: "7057ff" }
    - { name: "help wanted", color: "008672" }

# Team names are not in the config; they are derived from the repo name: "<repo>-devs".
