# =============================================================================
# people.yml — org MEMBERSHIP (NOT privilege)
# =============================================================================
# Read by terraform/people.tf. Every name is an org member (default `member`).
# Ownership and org-wide roles (head-of-engineering) live in privileged.yml —
# this file CANNOT express privilege (secure by construction). Machine-owned:
# the dashboard adds/removes members in this file.
#
# ⚠️ Names must be REAL GitHub usernames — adding a name produces a real org
# invitation during `apply`. The values below are examples only; replace them
# with your own members.
#
# Repo permissions (mentor/developer) live in repositories/*.yml, not here.
# =============================================================================

version: 1

members:
  - mentor-a
  - dev-1
  - dev-2
  - dev-3
