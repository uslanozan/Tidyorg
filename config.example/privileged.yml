# =============================================================================
# privileged.yml — HUMAN-OWNED · CODEOWNERS PROTECTED
# =============================================================================
# Read by terraform/people.tf. Defines org owners and org-wide roles.
#
# 🔒 THE DASHBOARD NEVER WRITES TO THIS FILE. This is the only legitimate way to
#    escalate privilege (making someone an owner or head-of-engineering): a
#    CODEOWNERS-protected change + approval from an existing administrator.
#    people.yml changes often and is written by a machine; this file changes
#    rarely and is written by a human.
#
# ⚠️ Every name here must also be in people.yml → members (privilege cannot come
#    before membership — this is verified during the plan phase).
#
# -----------------------------------------------------------------------------
# FIELDS
# -----------------------------------------------------------------------------
# org_owners  People who will be org owners (the GitHub API equivalent is `admin`).
#             An org owner is authorized for EVERYTHING: admin on every repo, exempt
#             on every protected branch, add/remove members, org settings, repo deletion.
#
# roles       Org-wide role name → the people who carry that role. The only org-wide
#             role is head-of-engineering (organization.yml → roles.*.scope). Repo-scoped
#             roles (mentor/developer) are NOT written HERE; use repositories/*.yml.
# =============================================================================

version: 1

org_owners:
  - mentor-a

roles:
  head-of-engineering:
    - mentor-a
