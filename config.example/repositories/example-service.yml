# =============================================================================
# repositories/<repo-name>.yml — Individual repo configuration (EXAMPLE)
# =============================================================================
# The file name = the repo name that will be created on GitHub. This example file
# defines a repo named "example-service"; copy/rename it to add your own repos.
#
# Only fields that DIFFER from the defaults are written. Fields left empty are
# inherited from the "defaults" section in organization.yml.
#
# See ACCESS-MODEL.md & docs/config-guide.md
# =============================================================================

# The repo's description (Required)
description: "Payment gateway integration service"

# The main programming language the project is written in (visual label; CI detects the actual language)
language: go

# GitHub usernames of the mentors responsible for the project (List)
# At least 1 mentor must be assigned. Mentors get 'admin' permission on the repo.
mentors:
  - mentor-a

# Developers (List) — get 'push' permission on the repo, subject to branch protection.
developers:
  - dev-1
  - dev-2

# Repo visibility (Optional) — public | private. If unspecified, defaults.visibility.
visibility: private

# Archiving (Optional) — true = the repo is frozen (read-only). Use this instead of deleting.
archived: false

# GitHub feature settings (Optional; if unspecified, the defaults are used)
has_issues: true
has_projects: false
has_wiki: false
auto_init: true
default_branch: develop

# Branch protection overrides (Optional) — only fields that differ from the defaults are written.
protected_branches:
  main:
    required_reviews: 3 # 3 approvals instead of the default 2
  develop:
    required_reviews: 0 # Merge without approval for quick experimentation
    require_status_checks: [] # Merge without waiting for CI

# Path-based review routing (CODEOWNERS) (Optional)
# NOTE: does not restrict merge PERMISSION, it only adds an approval requirement on the PR
# (enforced when require_code_owner_review: true).
code_owners:
  "/backend/": [dev-1]
  "/frontend/": [dev-2]

# Workflows to be distributed externally (Optional) — ci | release | dependabot
workflows:
  - ci
  - release
  - dependabot
